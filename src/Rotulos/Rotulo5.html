		<script>
			const endDates = [{ id: "etapa-1", date: "2025-04-23" }];

			endDates.forEach((etapa) => {
				const today = new Date();
				const endDate = new Date(etapa.date);

				// Zerando as horas, minutos e segundos para comparar apenas a data
				today.setHours(0, 0, 0, 0);
				endDate.setHours(0, 0, 0, 0);

				if (today > endDate) {
					// Mudar background
					const section = document.getElementById(etapa.id);
					if (
						section.classList.contains("background-red-100") ||
						section.classList.contains("background-blue-100")
					) {
						section.classList.remove(
							"background-red-100",
							"background-blue-100"
						);
						section.classList.add("background-neutral-100");
					}

					// Desabilitar botão
					const button = document.getElementById(`${etapa.id}-button`);
					button.classList.remove("button--blue");
					button.classList.add("disabled");

					buttonText.textContent = "Encerrado";
