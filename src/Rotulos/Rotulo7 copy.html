<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Collapse com iframe Responsivo</title>
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: Arial, sans-serif;
			}

			.container {
				max-width: 1000px;
				margin: 40px auto;
				padding: 0 16px;
			}

			.toggle-btn {
				padding: 10px 20px;
				background-color: #4f46e5;
				color: white;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				font-size: 16px;
				transition: background 0.3s;
			}

			.toggle-btn:hover {
				background-color: #3730a3;
			}

			.iframe-wrapper {
				margin-top: 20px;
				display: none;
				width: 100%;
				aspect-ratio: 16 / 9; /* Mantém proporção */
				border-radius: 8px;
				overflow: hidden;
				transition: all 0.3s ease;
			}

			.iframe-wrapper iframe {
				width: 100%;
				height: 100%;
				border: none;
				display: block;
			}

			.iframe-wrapper.active {
				display: block;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<button id="toggleBtn" class="toggle-btn">Abrir iframe</button>

			<div id="iframeWrapper" class="iframe-wrapper">
				<iframe
					src="https://www.youtube.com/embed/0FEVmjeS6XM?si=s7QUEuWc4Pyqgu10"
					title="Exemplo"></iframe>
			</div>
		</div>

		<script>
			const btn = document.getElementById("toggleBtn");
			const iframeWrapper = document.getElementById("iframeWrapper");

			btn.addEventListener("click", () => {
				iframeWrapper.classList.toggle("active");
				btn.textContent = iframeWrapper.classList.contains("active")
					? "Fechar iframe"
					: "Abrir iframe";
			});
		</script>
	</body>
</html>
